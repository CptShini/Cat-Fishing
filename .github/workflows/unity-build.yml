name: Unity Build

on:
  push:
    branches:
      - main
      - pre-release
    tags:
      - 'v*'

  pull_request:
    branches:
      - main
      - pre-release

# Default permissions for the normal build job.
permissions:
  contents: read

jobs:
  build:
    name: Unity Windows Build
    runs-on: ubuntu-latest

    steps:
      # Free disk space for Unity
      - name: Free disk space for Unity
        uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      # Cache Unity's Library directory
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-CatFishing-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-CatFishing-Windows-

      # Build Windows player
      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64

      # Package the complete build folder.
      # This works regardless of the executable's exact name.
      - name: Package Windows build
        run: |
          set -euo pipefail
          test -d build
          cd build
          zip -qr "$RUNNER_TEMP/CatFishing-Windows.zip" .
          test -s "$RUNNER_TEMP/CatFishing-Windows.zip"

      # Keep a temporary downloadable artifact for every build.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatFishing-Windows
          path: ${{ runner.temp }}/CatFishing-Windows.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release

    # Only version-tag pushes publish releases.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

    needs: build
    runs-on: ubuntu-latest

    # Only this job needs permission to publish a release.
    permissions:
      contents: write

    steps:
      # Get the full Git history so we can validate the release tag.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Only allow stable version tags on commits already in main.
      - name: Validate release tag
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a stable version tag such as v1.2.3"
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit reachable from main."
            exit 1
          fi

      # Download the ZIP generated by the build job.
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: CatFishing-Windows

      # Give the released file a version-specific name.
      - name: Rename release asset
        run: mv CatFishing-Windows.zip "CatFishing-${GITHUB_REF_NAME}-Windows.zip"

      # Publish the release and attach the Windows build.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: CatFishing ${{ github.ref_name }}
          files: CatFishing-${{ github.ref_name }}-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
