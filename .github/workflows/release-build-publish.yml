name: Build & Publish Release

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      publish: ${{ steps.validate.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate promoted version tag
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
        run: bash Scripts/ci/validate-promoted-release.sh

  build-release:
    name: Build release
    needs: validate-release
    if: ${{ github.event_name == 'push' && needs.validate-release.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Free disk space for Unity
        uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: "Checkout ${{ needs.validate-release.outputs.tag }}"
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          fetch-depth: 0
          lfs: true

      - name: Checkout trusted scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          persist-credentials: false

      - name: Cache Unity library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-CatFishing-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-CatFishing-Windows-

      - name: "Build release ${{ needs.validate-release.outputs.tag }}"
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          versioning: Tag

      - name: Prepare release ZIP
        env:
          VERSION_TAG: ${{ needs.validate-release.outputs.tag }}
        run: bash .ci-tools/Scripts/ci/prepare-windows-build.sh release

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: CatFishing-Release-${{ needs.validate-release.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/CatFishing-${{ needs.validate-release.outputs.tag }}-Windows.zip
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub release
    needs: [validate-release, build-release]
    if: ${{ always() && github.event_name == 'push' && needs.validate-release.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: "Download release ${{ needs.validate-release.outputs.tag }} package"
        uses: actions/download-artifact@v4
        with:
          name: CatFishing-Release-${{ needs.validate-release.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate-release.outputs.tag }}
          name: CatFishing ${{ needs.validate-release.outputs.tag }}
          files: release-assets/CatFishing-${{ needs.validate-release.outputs.tag }}-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord about release
        if: ${{ always() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          VERSION_TAG: ${{ needs.validate-release.outputs.tag }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.validate-release.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_STATUS: ${{ job.status }}
        run: bash Scripts/ci/notify-discord.sh release
