name: PR Source Branch Policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches: [main, pre-release]

permissions: {}

jobs:
  pr-source-branch-policy:
    name: PR source branch policy
    runs-on: ubuntu-latest
    steps:
      - name: "Enforce allowed PR source branch (${{ github.head_ref }} -> ${{ github.base_ref }})"
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$HEAD_REPOSITORY" != "$TARGET_REPOSITORY" ]]; then
            echo '::error::PRs must originate from this repository.'
            exit 1
          fi

          case "$BASE_REF" in
            main)
              if [[ "$HEAD_REF" != "pre-release" ]]; then
                echo '::error::PRs into main must come from pre-release.'
                exit 1
              fi
              ;;
            pre-release)
              if [[ ! "$HEAD_REF" =~ ^develop/.+ ]]; then
                echo '::error::PRs into pre-release must come from develop/<name>.'
                exit 1
              fi
              ;;
            *)
              echo "::error::Unexpected target branch: $BASE_REF"
              exit 1
              ;;
          esac

          echo 'PR source branch is allowed.'