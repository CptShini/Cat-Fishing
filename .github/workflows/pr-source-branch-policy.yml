name: PR Source Branch Policy

on:
  pull_request:
    branches:
      - main
      - pre-release

permissions:
  contents: read

jobs:
  pr-source-branch-policy:
    name: PR source branch policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false

      - name: "Enforce allowed PR source branch (${{ github.head_ref }} -> ${{ github.base_ref }})"
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: bash Scripts/ci/validate-pr-source-branch.sh
