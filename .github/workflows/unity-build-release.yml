name: Unity Build

on:
  push:
    branches:
      - pre-release
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------
  # Validate release tags BEFORE spending time on a Unity build.
  # This job also succeeds for ordinary pre-release pushes.
  # ----------------------------------------------------------
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and confirm commit is on main
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a stable version tag such as v1.2.3."
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi

          echo "Validated release tag $GITHUB_REF_NAME."

      - name: No tag to validate for pre-release build
        if: ${{ github.ref == 'refs/heads/pre-release' }}
        run: echo "This is a pre-release branch build."

  # ----------------------------------------------------------
  # Unity build: ONLY pre-release pushes and validated version tags.
  # ----------------------------------------------------------
  build:
    name: Unity Windows Build
    needs: validate-release
    if: >-
      ${{
        github.ref == 'refs/heads/pre-release' ||
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space for Unity
        uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-CatFishing-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-CatFishing-Windows-

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          versioning: ${{ startsWith(github.ref, 'refs/tags/v') && 'Tag' || 'None' }}

      - name: Prepare Windows build
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="build/StandaloneWindows64"
          DIST_DIR="dist"

          test -f "$BUILD_DIR/StandaloneWindows64.exe"
          test -d "$BUILD_DIR/StandaloneWindows64_Data"

          # Include the version tag in the executable name for releases.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            APP_NAME="CatFishing-Windows-${GITHUB_REF_NAME}"
          else
            APP_NAME="CatFishing-Windows"
          fi

          mkdir -p "$DIST_DIR"
          cp -a "$BUILD_DIR/." "$DIST_DIR/"

          mv "$DIST_DIR/StandaloneWindows64.exe" \
             "$DIST_DIR/${APP_NAME}.exe"

          mv "$DIST_DIR/StandaloneWindows64_Data" \
             "$DIST_DIR/${APP_NAME}_Data"

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "Prepared ${APP_NAME}.exe"

      - name: Upload build artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: CatFishing-Windows-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # Provide a direct, clickable link on the workflow run summary.
      - name: Add pre-release download link
        if: ${{ github.ref == 'refs/heads/pre-release' }}
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        shell: bash
        run: |
          {
            echo "## Cat Fishing pre-release build"
            echo
            echo "[Download the Windows build]($ARTIFACT_URL)"
            echo
            echo "Built from commit \`$GITHUB_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish GitHub Release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: CatFishing-Windows-${{ github.sha }}
          path: release-assets

      - name: Package versioned release ZIP
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="CatFishing-Windows-${GITHUB_REF_NAME}"
          PACKAGE_DIR="release-assets/${APP_NAME}"

          mkdir -p "$PACKAGE_DIR"

          # Move every downloaded game file into a named folder.
          find release-assets -mindepth 1 -maxdepth 1 \
            ! -name "$APP_NAME" \
            -exec mv -t "$PACKAGE_DIR" -- {} +

          test -f "$PACKAGE_DIR/${APP_NAME}.exe"
          test -d "$PACKAGE_DIR/${APP_NAME}_Data"

          # Create the ZIP outside the folder being archived.
          (
            cd release-assets
            zip -qr "CatFishing-${GITHUB_REF_NAME}-Windows.zip" \
              "$APP_NAME"
          )

          test -s \
            "release-assets/CatFishing-${GITHUB_REF_NAME}-Windows.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: CatFishing ${{ github.ref_name }}
          files: release-assets/CatFishing-*-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
