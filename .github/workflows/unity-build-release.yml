name: Unity Build

on:
  push:
    branches:
      - pre-release
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag (skip on pre-release)
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == "refs/heads/pre-release" ]]; then
            echo "No release tag to validate; continuing with pre-release build."
            exit 0
          fi

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a stable version tag such as v1.2.3."
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi

          echo "Validated release tag $GITHUB_REF_NAME."

  build:
    name: Unity Windows Build
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space for Unity
        uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-CatFishing-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-CatFishing-Windows-

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          versioning: ${{ startsWith(github.ref, 'refs/tags/v') && 'Tag' || 'None' }}

      - name: Prepare Windows build
        shell: bash
        run: bash scripts/ci/prepare-windows-build.sh

      - name: Upload build artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: CatFishing-Windows-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Notify Discord about pre-release build
        if: github.ref == 'refs/heads/pre-release'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PRE_RELEASE_WEBHOOK_URL }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash Scripts/ci/notify-discord.sh prerelease

      - name: Add pre-release download link
        if: github.ref == 'refs/heads/pre-release'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        shell: bash
        run: |
          {
            printf '## CatFishing pre-release build\n\n'
            printf '[Download the Windows build](%s)\n\n' "$ARTIFACT_URL"
            printf 'Built from commit `%s`.\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: CatFishing-Windows-${{ github.sha }}
          path: release-assets

      - name: Package versioned release ZIP
        shell: bash
        run: bash scripts/ci/package-windows-release.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: CatFishing ${{ github.ref_name }}
          files: release-assets/CatFishing-${{ github.ref_name }}-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord about release
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash Scripts/ci/notify-discord.sh release
