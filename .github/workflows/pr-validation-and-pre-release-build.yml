name: PR Validation & Pre-Release Build

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled
      - ready_for_review
      - closed
    branches: [main, pre-release]

permissions:
  contents: read

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest
    permissions: { }
    if: ${{ github.base_ref == 'pre-release' }}
    outputs:
      version_label: ${{ steps.version.outputs.version_label }}
    
    steps:
      - name: Validate source branch
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          
          if [[ -z "$HEAD_REPOSITORY" || "$HEAD_REPOSITORY" != "$TARGET_REPOSITORY" ]]; then
            echo '::error::PRs must originate from this repository.'
            exit 1
          fi
          
          case "$BASE_REF" in
            main)
              if [[ "$HEAD_REF" != "pre-release" ]]; then
                echo '::error::PRs into main must come from pre-release.'
                exit 1
              fi
              ;;
          
            pre-release)
              if [[ ! "$HEAD_REF" =~ ^develop/.+ ]]; then
                echo '::error::PRs into pre-release must come from develop/<name>.'
                exit 1
              fi
              ;;
          
            *)
              echo "::error::Unexpected target branch: $BASE_REF"
              exit 1
              ;;
          esac
          
          echo 'PR source branch is allowed.'

      - name: Validate version labels
        id: version
        if: ${{ github.base_ref == 'pre-release' }}
        shell: bash
        env:
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          
          mapfile -t labels < <(
            jq -r '.[] | .name | select(startswith("version:"))' <<< "$PR_LABELS_JSON"
          )
          
          (( ${#labels[@]} <= 1 )) || {
            echo "::error::Use at most one version:* label."
            exit 1
          }
          
          label="${labels[0]:-}"
          
          case "$label" in
            ''|version:major|version:minor|version:patch) ;;
            *)
              echo "::error::Unsupported label '$label'. Use version:major, version:minor, or version:patch."
              exit 1
              ;;
          esac

          echo "Version selection: ${label:-none (skip)}"
          echo "version_label=$label" >> "$GITHUB_OUTPUT"

  create-tag:
    name: Create pre-release version tag
    needs: validate-pr
    if: >-
      ${{
        github.base_ref == 'pre-release' &&
        github.event.action == 'closed' &&
        github.event.pull_request.merged == true &&
        needs.validate-pr.outputs.version_label != ''
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Verify version label
        env:
          VERSION_LABEL: ${{ needs.validate-pr.outputs.version_label }}
        run: |
          echo "Selected version label: ${VERSION_LABEL:-<empty>}"
          [[ -n "$VERSION_LABEL" ]] || {
            echo "::error::Missing version label output."
            exit 1
          }

      - name: Create version tag for merged PR
        id: tag
        env:
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          VERSION_LABEL: ${{ needs.validate-pr.outputs.version_label }}
        run: bash Scripts/ci/create-pre-release-tag.sh

  build:
    name: Build pre-release
    needs: create-tag
    runs-on: ubuntu-latest
    cache-mode: write
    permissions:
      contents: read
    steps:
      - name: Free disk space for Unity
        uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true

      - name: "Checkout ${{ needs.create-tag.outputs.tag }}"
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag }}
          fetch-depth: 1
          lfs: true

      - name: Checkout trusted scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .ci-tools
          persist-credentials: false

      - name: Cache Unity library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-CatFishing-PreRelease-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-CatFishing-PreRelease-Windows-

      - name: "Build pre-release ${{ needs.create-tag.outputs.tag }}"
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          versioning: Tag
          buildProfile: 'Assets/Settings/Build Profiles/Windows.asset'

      - name: Prepare Windows build
        env:
          VERSION_TAG: ${{ needs.create-tag.outputs.tag }}
        run: bash .ci-tools/Scripts/ci/prepare-windows-build.sh prerelease

      - name: Upload build artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: CatFishing-Windows-${{ needs.create-tag.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Notify Discord about pre-release build
        if: ${{ always() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PRE_RELEASE_WEBHOOK_URL }}
          VERSION_TAG: ${{ needs.create-tag.outputs.tag }}
          VERSION_SHA: ${{ needs.create-tag.outputs.sha }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_STATUS: ${{ job.status }}
        run: bash .ci-tools/Scripts/ci/notify-discord.sh prerelease
