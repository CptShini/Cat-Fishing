name: Build Pre-Release

on:
  pull_request_target:
    branches: [pre-release]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, closed]

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate pre-release version
    runs-on: ubuntu-latest
    outputs:
      version_label: ${{ steps.check.outputs.version_label }}
    steps:
      - name: Validate version labels
        id: check
        shell: bash
        env:
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          mapfile -t labels < <(jq -r '.[] | .name | select(startswith("version:"))' <<< "$PR_LABELS_JSON")
          (( ${#labels[@]} <= 1 )) || { echo "::error::Use at most one version:* label."; exit 1; }

          label="${labels[0]:-}"
          case "$label" in
            ''|version:major|version:minor|version:skip) ;;
            *) echo "::error::Unsupported label '$label'. Use version:major, version:minor, or version:skip."; exit 1 ;;
          esac
          echo "version_label=$label" >> "$GITHUB_OUTPUT"

  create-tag:
    name: Create pre-release version tag
    needs: validate-version
    if: >-
      ${{
        github.event.action == 'closed' &&
        github.event.pull_request.merged == true &&
        needs.validate-version.outputs.version_label != 'version:skip'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Create version tag for merged PR
        id: tag
        env:
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          VERSION_LABEL: ${{ needs.validate-version.outputs.version_label }}
        run: bash Scripts/ci/create-pre-release-tag.sh

  build:
    name: Build pre-release
    needs: create-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Free disk space for Unity
        uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: "Checkout ${{ needs.create-tag.outputs.tag }}"
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag }}
          fetch-depth: 0
          lfs: true

      - name: Checkout trusted CI scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .ci-tools
          persist-credentials: false

      - name: Cache Unity library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-CatFishing-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-CatFishing-Windows-

      - name: "Build pre-release ${{ needs.create-tag.outputs.tag }}"
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          versioning: Tag

      - name: Prepare Windows build
        env:
          VERSION_TAG: ${{ needs.create-tag.outputs.tag }}
        run: bash .ci-tools/Scripts/ci/prepare-windows-build.sh prerelease

      - name: Upload build artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: CatFishing-Windows-${{ needs.create-tag.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Notify Discord about pre-release build
        if: ${{ always() && steps.upload.outcome == 'success' }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PRE_RELEASE_WEBHOOK_URL }}
          VERSION_TAG: ${{ needs.create-tag.outputs.tag }}
          VERSION_SHA: ${{ needs.create-tag.outputs.sha }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .ci-tools/Scripts/ci/notify-discord.sh prerelease
