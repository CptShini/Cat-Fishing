name: PR Source Branch Policy

on:
  pull_request:
    branches:
      - main
      - pre-release

permissions:
  contents: read

jobs:
  pr-source-policy:
    name: PR source branch policy
    runs-on: ubuntu-latest

    steps:
      - name: Enforce allowed PR source branch
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          
          # This branch workflow is designed for branches in this
          # repository, not similarly named branches in forks.
          if [[ "$HEAD_REPOSITORY" != "$TARGET_REPOSITORY" ]]; then
            echo "::error::PRs must originate from a branch in this repository."
            exit 1
          fi
          
          if [[ "$BASE_REF" == "main" ]]; then
            if [[ "$HEAD_REF" != "pre-release" ]]; then
              echo "::error::PRs into main must come from pre-release."
              exit 1
            fi
          
          elif [[ "$BASE_REF" == "pre-release" ]]; then
            if [[ ! "$HEAD_REF" =~ ^develop/.+ ]]; then
              echo "::error::PRs into pre-release must come from develop/<name>."
              exit 1
            fi
          
          else
            echo "::error::Unexpected target branch: $BASE_REF"
            exit 1
          fi
          
          echo "PR source branch is allowed."